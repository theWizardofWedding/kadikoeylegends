<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171325"><meta name="description" content="Verzaubertes Wedding Game Night — Wizard scorekeeping in eight languages."><title>Verzaubertes Wedding · Game Night</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body>

<section id="wizard" hidden><div class="wizard-toolbar"><button id="toLobby" class="secondary" data-t="lobby">Game lobby</button><div class="tools"><button id="soundToggle" type="button" aria-pressed="false"></button><button id="effectsToggle" type="button" aria-pressed="true"></button><button id="export" type="button" data-t="export"></button><button id="import" type="button" data-t="import"></button><input id="importFile" type="file" accept=".json,application/json" hidden></div></div><div class="wizard-layout"><aside class="hero"><p class="eyebrow">WIZARD · GAME NIGHT</p><h1>Verzaubertes Wedding</h1><p id="heroStatus" class="status-pill"></p><p id="heroHelp" class="muted"></p><div id="glance" class="glance"></div><p class="storage-note" data-t="savedLocal"></p></aside><div class="workspace">
